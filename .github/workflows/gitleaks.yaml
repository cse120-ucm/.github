name: Gitleaks Secret Scanner

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks-scan
    runs-on: arc-runner-cse120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Still necessary so Gitleaks can see the codebase
          fetch-depth: 0

      - name: Run Gitleaks (CLI Bypass)
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: |
          # 1. Download the exact same Gitleaks binary the Action was trying to use
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp
          
          # 2. Force a direct scan of the workspace, completely ignoring the PR commit diff logic
          /tmp/gitleaks detect --source . --verbose --redact
